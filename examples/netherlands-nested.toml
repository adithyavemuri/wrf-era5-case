[case]
name = "netherlands_nested"
start = "2025-01-10 00:00:00"
end = "2025-01-10 06:00:00"
interval_seconds = 3600

[[domain]]
name = "d01"
center_latitude = 52.0
center_longitude = 5.0
true_latitude_1 = 52.0
true_latitude_2 = 52.0
standard_longitude = 5.0
dx = 9000
dy = 9000
nx = 100
ny = 100
vertical_levels = 40

[[domain]]
name = "d02"
parent_id = 1
parent_grid_ratio = 3
parent_time_step_ratio = 3
i_parent_start = 25
j_parent_start = 25
nx = 151
ny = 151
vertical_levels = 40

[era5]
forcing_mode = "reanalysis"
directory = "../data/ERA5"
margin_degrees = 1.0

[geodata]
profile = "low"
directory = "../data/WPS_GEOG"

[wrf]
physics_profile = "demonstration"

[namelist.domains]
time_step = 54
feedback = 0

[build]
mode = "reuse-or-build"
autocompiler = "../../wrf-autocompiler/build_wrf.sh"
build_root = "../../wrf-arw-local"

[runtime]
execution = "local"
mpi_processes = 4
run_id = "netherlands-nested-001"

[restart]
enabled = true
# Defaults to 180 minutes here because the finest grid is 3 km.
retain = 2
resume = "auto"

[analysis]
enabled = true
domain = "d02"
latitude = 52.0
longitude = 5.0
profile_top_metres = 2000
shear_bottom_metres = 40
shear_top_metres = 200
wrf_tools_executable = "../../WRF_tools/.venv/bin/wrf-tools"

[output]
case_directory = "../cases/netherlands_nested"
