[case]
name = "netherlands_demo"
start = "2025-01-10 00:00:00"
end = "2025-01-10 06:00:00"
interval_seconds = 3600

[domain]
center_latitude = 52.0
center_longitude = 5.0
true_latitude_1 = 52.0
true_latitude_2 = 52.0
standard_longitude = 5.0
dx = 9000
dy = 9000
nx = 100
ny = 100
vertical_levels = 40

[era5]
forcing_mode = "reanalysis"
directory = "../data/ERA5"
margin_degrees = 1.0
# The complete 37-level ERA5 pressure-level set is used unless overridden.

[geodata]
profile = "low"
directory = "../data/WPS_GEOG"

[wrf]
physics_profile = "demonstration"
history_interval_minutes = 60
time_step_seconds = 54

[build]
mode = "reuse-or-build"
autocompiler = "../../wrf-autocompiler/build_wrf.sh"
build_root = "../../wrf-arw-local"

[runtime]
execution = "local"
mpi_processes = 4
# These two paths reuse the completed proof-of-concept. Remove them in a new
# case to use the default case-local workflow directories.
wps_run_directory = "../cases/netherlands_demo/acceptance/wps-run"
wrf_run_directory = "../cases/netherlands_demo/acceptance/wrf-run"

[analysis]
enabled = true
domain = "d01"
latitude = 52.0
longitude = 5.0
wrf_tools_executable = "../../WRF_tools/.venv/bin/wrf-tools"
output_directory = "../cases/netherlands_demo/reports/wrf-tools"

[output]
case_directory = "../cases/netherlands_demo"
